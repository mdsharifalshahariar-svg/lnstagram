<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Instragram - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fafafa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 350px;
      background: white;
      border: 1px solid #ddd;
      padding: 40px 35px;
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 35px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fafafa;
      outline: none;
    }

    input:focus {
      border-color: #999;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 5px;
      background: #0095f6;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #007acb;
    }

    .forgot {
      display: block;
      margin-top: 20px;
      color: #00376b;
      text-decoration: none;
      font-size: 13px;
    }

    .signup {
      margin-top: 30px;
      font-size: 14px;
    }

    .signup a {
      color: #0095f6;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">Instragram</div>

    <form id="loginForm">

      <input
        type="text"
        id="username"
        placeholder="Username or email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Log in</button>

    </form>

    <a href="#" class="forgot">Forgot password?</a>

    <div class="signup">
      Don't have an account?
      <a href="#">Sign up</a>
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value;

      alert("Welcome to Instragram, " + username + "!");
    });
  </script>

</body>
</html>
